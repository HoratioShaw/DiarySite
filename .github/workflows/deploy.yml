name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare SSH key
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          install -m 600 /dev/null "$RUNNER_TEMP/site_key"
          printf '%s\n' "$SERVER_SSH_KEY" > "$RUNNER_TEMP/site_key"

      # 部署前先看一眼目标目录：只有确认过里面有什么，rsync 的排除清单才可信
      - name: Confirm target directory
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -Eeuo pipefail
          ssh -i "$RUNNER_TEMP/site_key" -o StrictHostKeyChecking=accept-new -o BatchMode=yes \
            "$SERVER_USER@$SERVER_HOST" 'ls -A /www/wwwroot/diary.horatio.cn'

      # 只同步清单内文件：清单里的新增/修改才上传，仓库删掉的文件才从服务器删除；
      # 服务器原有数据不在清单里，永不触碰；面板/证书文件永不传输、永不删除
      - name: Deploy via rsync
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -Eeuo pipefail
          DEPLOY_HOST="$SERVER_USER@$SERVER_HOST" \
          DEPLOY_DEST=/www/wwwroot/diary.horatio.cn \
          DEPLOY_SSH_KEY="$RUNNER_TEMP/site_key" \
          DEPLOY_TRACKED=1 \
            bash ci/deploy-managed.sh . ci/deploy-exclude.txt

      - name: Cleanup SSH key
        if: always()
        run: rm -f "$RUNNER_TEMP/site_key"
