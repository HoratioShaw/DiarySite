<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>下载热量日记与开支日记</title>
<meta name="description" content="下载热量日记与开支日记 Android 版安装包">
<meta name="color-scheme" content="light dark">
<!--
  图标取自开源图标库 lucide（ISC 许可，https://lucide.dev/license）的官方 SVG，内联改写；
  全站图标（顶栏标识 / favicon / apple-touch-icon / 卡片 App 图标）同一套几何：squircle 超椭圆底（|x|⁵+|y|⁵=1，
  108 视口 8% 留白）叠蓝渐变 + 白色 lucide 字形，字形统一 68×68 居中于 20,20；
  apple-touch-icon 为 iOS 要求的满幅不透明底（圆角由系统自裁），字形按遮罩后的比例放大到 120/180。
  渐变与两 App 启动图标 ic_launcher_background 同源（ARGB #FF4D95FF→#FF2B6DE8，
  展开即 #4495FF→#2B6DE8 竖直渐变），字形路径照抄两仓 ic_launcher_foreground.xml。
  本页无任何外部运行时依赖（无 CDN 脚本 / 外部字体 / 外部图片），字体走系统字体栈。
-->
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#3482FF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<style>
  /* ── 单一内联 token 块（Miuix 0.9.5-beta02 视觉语言）─────────
     语义 5 级表面 / 4·8pt 间距 / 圆角 / 字阶 / 动效 / 玻璃，全部就地定义，无外部资源。
     旧变量名保留为别名，render 路径与查询选择器零改动。 */
  :root {
    color-scheme: light dark;

    /* 品牌色：焦点环 / 图标 / 主按钮 */
    --primary: #3482FF;
    --primary-deep: #2C6ED9;       /* 压暗伴生色：白字按钮达 WCAG AA 4.84:1 */
    --primary-deep-hover: #2762BF;
    --primary-wash: rgba(52, 130, 255, .12);

    /* 语义表面（浅色，5 级）：background → surface → container → container-high → variant */
    --background: #F7F7F7;
    --surface: #FFFFFF;
    --surface-container: #F0F0F0;
    --surface-container-high: #E8E8E8;
    --surface-variant: #E0E0E0;

    /* 吸顶玻璃顶栏高度 + 光学留白：避免锚点/焦点目标被顶栏遮住（WCAG 2.4.11） */
    --header-h: 56px;
    --anchor-gap: 16px;

    /* 旧名别名：值与既有站点保持一致，CSS/JS 契约不变 */
    --canvas: var(--background);
    --card: var(--surface);
    --btn2: var(--surface-container);
    --line: var(--surface-variant);

    /* 前景：onSurfaceVariantSummary = 次级说明文字（介绍 / 元信息） */
    --ink: #000000;
    --on-surface-variant-summary: rgba(0, 0, 0, .6);
    --ink-2: var(--on-surface-variant-summary);
    --btn2-ink: #303030;

    /* 圆角 token */
    --r-8: 8px; --r-12: 12px; --r-16: 16px; --r-28: 28px;

    /* 间距 token（4/8pt） */
    --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 20px;
    --sp-6: 24px; --sp-7: 28px; --sp-8: 32px; --sp-10: 40px; --sp-18: 72px;

    /* 字阶 token */
    --fs-title2: 24px;
    --fs-body2: 14px; --fs-footnote: 12px;

    /* 动效 token：开关/分段控件用 spring，其余克制；reduce 下由媒体查询统一禁用 */
    --ease-standard: cubic-bezier(.16, 1, .3, 1);
    --ease-spring: cubic-bezier(.34, 1.56, .64, 1);
    --dur-fast: 160ms; --dur-med: 200ms; --dur-slow: 300ms;

    /* 高度 / 骨架 / 玻璃 */
    --shadow-1: 0 1px 2px rgba(0, 0, 0, .04), 0 8px 24px rgba(0, 0, 0, .06);
    --shadow-2: 0 2px 6px rgba(0, 0, 0, .06), 0 16px 36px rgba(0, 0, 0, .1);
    --ico-shadow: drop-shadow(0 8px 16px rgba(43, 109, 232, .22));
    --shimmer: rgba(255, 255, 255, .85);
    --fade: rgba(0, 0, 0, .16);
    --glass-bg: rgba(247, 247, 247, .72);
    --glass-card-bg: rgba(255, 255, 255, .82);
    --glass-card-blur: 16px;
    --glass-card-saturate: 1.4;

    --gutter: clamp(16px, 4vw, 32px);
    --font: MiSans, -apple-system, "HarmonyOS Sans SC", "PingFang SC",
      "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      /* 语义表面（深色）：background → surface → container → container-high → variant */
      --background: #000000;
      --surface: #242424;
      --surface-container: #434343;
      --surface-container-high: #4F4F4F;
      --surface-variant: #393939;
      --ink: rgba(255, 255, 255, .9);    /* #E6FFFFFF */
      --on-surface-variant-summary: rgba(255, 255, 255, .6);
      --btn2-ink: #D9D9D9;
      --primary-wash: rgba(52, 130, 255, .2);
      --shimmer: rgba(255, 255, 255, .12);
      --fade: rgba(255, 255, 255, .3);
      --shadow-1: 0 1px 2px rgba(0, 0, 0, .5), 0 8px 24px rgba(0, 0, 0, .45);
      --shadow-2: 0 2px 6px rgba(0, 0, 0, .55), 0 16px 36px rgba(0, 0, 0, .5);
      --ico-shadow: drop-shadow(0 8px 18px rgba(43, 109, 232, .4));
      --glass-bg: rgba(0, 0, 0, .6);
      --glass-card-bg: rgba(36, 36, 36, .82);
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--canvas);
    color: var(--ink);
    font-family: var(--font);
    font-size: 16px;
    line-height: 1.6;
    display: flex;
    min-height: 100vh;
    min-height: 100dvh;
    flex-direction: column;
  }
  /* 居中容器：PC 上限 960px，手机水平 padding ≥16px，刘海/圆角安全区补白，永不横向滚动 */
  .wrap {
    width: 100%;
    max-width: 960px;
    margin-inline: auto;
    padding-left: max(var(--gutter), env(safe-area-inset-left));
    padding-right: max(var(--gutter), env(safe-area-inset-right));
  }

  /* 图标（lucide 内联）：默认 1em，随文字对齐，颜色继承 currentColor */
  .ico { width: 1em; height: 1em; flex: none; vertical-align: -.125em; }

  /* 吸顶栏避让：锚点、键盘焦点与 scrollIntoView 都落在顶栏下方（含刘海安全区） */
  html { scroll-padding-top: calc(var(--header-h) + env(safe-area-inset-top) + var(--anchor-gap)); }

  /* 顶栏：Miuix 式玻璃 top bar（blur + saturate），不支持 backdrop-filter 时回退实底。
     与 tio.fyi 同款：56px 定高、内容垂直居中，32px 图标 + 15px 字，不再用上下 padding 撑高。
     刘海/全屏时顶部安全区补进 padding，定高只算内容区，两者相加才是顶栏总高 */
  header {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center;
    min-height: calc(var(--header-h) + env(safe-area-inset-top));
    padding-top: env(safe-area-inset-top);
    background: var(--glass-bg);
    -webkit-backdrop-filter: blur(24px) saturate(1.6);
    backdrop-filter: blur(24px) saturate(1.6);
    border-bottom: 1px solid var(--line);
  }
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    header { background: var(--canvas); }
    .card { background: var(--surface); }
  }
  .brand {
    display: flex; align-items: center; gap: 10px;
    font-size: 15px; font-weight: 600; letter-spacing: -.01em;
  }
  /* 顶栏标识与卡片图标同一套配比：squircle 渐变底 + 白色字形，故取白色前景 */
  .brand .mark { flex: none; color: #fff; }

  /* 引言区仅承载 noscript 提示，不占版面 */
  .intro { padding: 0; }
  .noscript-note {
    margin-top: var(--sp-4); padding: var(--sp-3) var(--sp-4);
    background: var(--surface-container);
    border: 1px dashed var(--line); border-radius: var(--r-16);
    font-size: var(--fs-body2); color: var(--ink-2);
  }

  /* Card 表面：手机单列全宽，≥768px 双卡并排 */
  .cards {
    display: grid; grid-template-columns: 1fr; gap: var(--sp-4);
    /* 顶栏与首卡之间留光学间距，窄屏不再粘在一起 */
    padding-top: clamp(var(--sp-4), 4vw, var(--sp-7));
    padding-bottom: clamp(var(--sp-10), 7vw, var(--sp-18));
  }
  @media (min-width: 768px) { .cards { grid-template-columns: 1fr 1fr; gap: var(--sp-6); } }

  .card {
    background: var(--glass-card-bg);
    -webkit-backdrop-filter: blur(var(--glass-card-blur)) saturate(var(--glass-card-saturate));
    backdrop-filter: blur(var(--glass-card-blur)) saturate(var(--glass-card-saturate));
    border-radius: var(--r-28);
    padding: clamp(var(--sp-5), 3vw, var(--sp-7));
    box-shadow: var(--shadow-1);
    display: flex;
    flex-direction: column;
    gap: var(--sp-5);
    transition: transform var(--dur-med) var(--ease-standard),
                box-shadow var(--dur-med) var(--ease-standard);
  }
  @media (hover: hover) {
    .card:hover { transform: translateY(-2px); box-shadow: var(--shadow-2); }
  }
  .card:active { transform: translateY(0); }

  /* 卡片头：squircle App 图标（108 视口、8% 留白 → 可视 56~64px，连续曲率由内联 SVG 保证）
     文字列在图标右侧：应用名 title2 / 事实性介绍 body2，二者始终可见、不依赖 hover 或展开 */
  .card-head { display: flex; align-items: center; gap: var(--sp-4); }
  .card-head .app-ico { flex: none; width: 64px; height: 64px; color: #fff; filter: var(--ico-shadow); }
  @media (min-width: 768px) { .card-head .app-ico { width: 72px; height: 72px; } }
  .card-head-text { min-width: 0; display: grid; gap: var(--sp-1); }
  .card-head h2 {
    font-size: var(--fs-title2); line-height: 1.3; font-weight: 400; letter-spacing: .01em;
  }
  .card-desc {
    font-size: var(--fs-body2); line-height: var(--sp-5);
    color: var(--on-surface-variant-summary);
  }

  /* 下载区：通道 / 说明 / 版本信息 / 下载按钮 / 更新说明。
     两卡行结构恒定：通道行、信息行、按钮行常驻，各状态只换行内内容，
     更新说明放在按钮之后——日志长短只影响卡片底部，不挤动下载按钮。 */
  .dl {
    padding-top: var(--sp-5);
    border-top: 1px solid var(--line);
    display: grid; gap: var(--sp-3); justify-items: stretch;
  }
  @media (min-width: 768px) { .dl { justify-items: start; } }

  /* 通道行：两个通道都有包 → 分段控件；只剩一个 → 静态徽标，不给出点了没反应的假选项。
     行高锁定 52px，两种形态互换时卡片不跳动 */
  .chans {
    min-height: 52px; display: flex; align-items: center; gap: var(--sp-1); padding: var(--sp-1);
    background: var(--surface-container); border-radius: var(--r-16);
  }
  .chans[data-mode="single"], .chans[data-mode="loading"], .chans[data-mode="none"] {
    padding: 0; background: none;
  }
  .chan {
    flex: 1 1 0;
    display: inline-flex; align-items: center; justify-content: center;
    min-height: 44px; padding: 0 var(--sp-4); border: 0; border-radius: var(--r-12);
    background: transparent; color: var(--ink-2);
    font: inherit; font-size: var(--fs-body2); font-weight: 600; cursor: pointer;
    transition: background-color var(--dur-med) var(--ease-standard),
                color var(--dur-med) var(--ease-standard),
                box-shadow var(--dur-med) var(--ease-standard),
                transform var(--dur-fast) var(--ease-spring);
  }
  .chan:active { transform: scale(.96); }
  .chan[aria-checked="true"] {
    background: var(--surface); color: var(--ink);
    box-shadow: 0 1px 3px rgba(0, 0, 0, .14);
  }
  .chan:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  /* 单通道：品牌色徽标，纯展示，不可聚焦 */
  .chan-static {
    display: inline-flex; align-items: center; gap: var(--sp-2);
    min-height: 44px; padding: 0 var(--sp-4); border-radius: var(--r-12);
    background: var(--primary-wash); color: #2762BF;
    font-size: var(--fs-body2); font-weight: 600;
  }
  /* 徽标字色单独取深一档（浅色 5.11:1 / 深色 7.12:1），品牌蓝在浅底上不达 AA */
  @media (prefers-color-scheme: dark) { .chan-static { color: #9CC2FF; } }
  .chan-static .ico { width: 15px; height: 15px; }
  .chan-static.is-loading, .chan-static.is-none {
    background: none; color: var(--ink-2); font-weight: 400;
  }
  @media (min-width: 768px) {
    .chans { display: inline-flex; }
    .chan { flex: 0 0 auto; padding: 0 var(--sp-5); }
  }
  /* 仅供读屏的通道禁用说明，绝不参与布局 */
  .sr-only {
    position: absolute; width: 1px; height: 1px;
    overflow: hidden; clip-path: inset(50%); white-space: nowrap;
  }

  /* 信息行：单行高恒定 + 垂直居中，行内内容切换时行高不塌 */
  .dl-row {
    min-height: 26px; display: flex; align-items: center; gap: var(--sp-3);
    flex-wrap: wrap; font-size: var(--fs-footnote); color: var(--ink-2);
  }
  .dl-row .with-ico { display: inline-flex; align-items: center; gap: var(--sp-1); }
  .dl-row .ico { width: 13px; height: 13px; }
  .dl-note[hidden], .chip[hidden], .sz[hidden], .dl-row .with-ico[hidden], .dl-row[hidden], .log-card[hidden] { display: none; }
  .dl-note .retry-link {
    color: var(--primary); background: none; border: 0; font: inherit; cursor: pointer;
    display: inline-flex; align-items: center; min-height: 44px;
    padding: var(--sp-1) var(--sp-2);
    margin: calc(var(--sp-1) * -1) calc(var(--sp-2) * -1); border-radius: var(--r-8);
  }
  .dl-note .retry-link:hover { background: var(--primary-wash); }
  /* Badge：版本徽标 */
  .chip {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: var(--fs-footnote); color: var(--ink);
    border: 1px solid var(--line); border-radius: var(--r-8); padding: 2px var(--sp-2);
    background: var(--surface-container);
  }
  /* 更新说明：常驻区块，永不折叠。固定约 6 行高的视窗内滚动，
     长日志不撑破卡片；滚动渐隐提示沿用 Lea Verou 配方，静态零 JS */
  .log-card {
    justify-self: stretch;
    display: grid; gap: var(--sp-1);
    padding: var(--sp-3) var(--sp-4);
    background: var(--surface-container); border-radius: var(--r-12);
  }
  .log-title { font-size: var(--fs-footnote); font-weight: 600; color: var(--ink); }
  .log-body {
    max-height: 124px; overflow: auto;
    font-size: var(--fs-footnote); line-height: 1.6; color: var(--ink-2);
    display: grid; gap: 3px; align-content: start;
    background-image:
      linear-gradient(var(--surface-container) 40%, rgba(0, 0, 0, 0)) top / 100% 14px no-repeat local,
      linear-gradient(rgba(0, 0, 0, 0), var(--surface-container) 60%) bottom / 100% 14px no-repeat local,
      radial-gradient(farthest-side at 50% 0, var(--fade), rgba(0, 0, 0, 0)) top / 100% 14px no-repeat scroll,
      radial-gradient(farthest-side at 50% 100%, var(--fade), rgba(0, 0, 0, 0)) bottom / 100% 14px no-repeat scroll;
  }
  .log-body.is-empty { color: var(--ink-2); }
  /* Releases 式分组：组标题（新增/变更/…）加粗，条目用 lucide 圆点 */
  .log-body .log-head { font-weight: 600; color: var(--ink); margin-top: 4px; }
  .log-body .log-head:first-child { margin-top: 0; }
  .log-body .log-item { display: flex; gap: 7px; }
  .log-body .log-item .ico { width: 5px; height: 5px; margin-top: .58em; color: var(--ink); opacity: .55; }

  /* 主按钮：高 48px（≥44 触达），手机全宽；按压轻微回弹 */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-2);
    min-height: 48px; padding: 0 var(--sp-7); border-radius: var(--r-16);
    background: var(--primary-deep); color: #fff;
    font-size: 16px; font-weight: 600; text-decoration: none;
    position: relative; overflow: hidden;
    width: 100%;
    transition: background-color var(--dur-med) var(--ease-standard),
                transform var(--dur-fast) var(--ease-spring);
  }
  .btn .ico { width: 18px; height: 18px; }
  .btn:active { transform: scale(.98); }
  @media (hover: hover) {
    .btn:not(.is-off):not(.is-loading):hover { background: var(--primary-deep-hover); }
  }
  @media (min-width: 768px) { .btn { width: auto; } }
  /* 空态/禁用按钮：次要态配色，不可点击、不给下载入口 */
  .btn.is-off, .btn.is-loading {
    background: var(--surface-container); color: var(--btn2-ink);
    pointer-events: none; cursor: default;
  }
  /* 探测期间的骨架态：不闪错误、不可点击 */
  .btn.is-loading::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(100deg, transparent 30%, var(--shimmer) 50%, transparent 70%);
    background-size: 200% 100%;
    animation: shimmer 1.2s linear infinite;
  }
  @keyframes shimmer { to { background-position: -200% 0; } }

  a:focus-visible, .btn:focus-visible {
    outline: 2px solid var(--primary); outline-offset: 2px;
  }

  /* 页脚：仅版权一行 */
  footer {
    margin-top: auto; border-top: 1px solid var(--line);
    padding-top: var(--sp-5);
    padding-bottom: calc(var(--sp-6) + env(safe-area-inset-bottom));
  }
  footer p { color: var(--ink-2); font-size: var(--fs-footnote); }

  /* reduced-motion：所有时长归零，含伪元素骨架动画；JS 微交互亦按 motionOK 跳过 */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      transition-duration: 0s !important;
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
    }
    .card:hover, .chan:active, .btn:active { transform: none; }
    .btn.is-loading::after { animation: none !important; }
  }

  /* 动效统一：入场/抬升/切换 160~300ms，克制 easing，单次不超过 400ms */
  @keyframes fade-in-up {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
  /* 卡片入场只淡入、不做位移：手机端顶栏与首卡间距最小只有 16px，
     12px 上浮会把间距吃掉一大半，刷新时看起来像卡片顶到顶栏 */
  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
  .cards .card:nth-child(1) { animation: fade-in var(--dur-slow) var(--ease-standard) .06s backwards; }
  .cards .card:nth-child(2) { animation: fade-in var(--dur-slow) var(--ease-standard) .14s backwards; }

  /* 微交互层：状态行浮现（探测完成/切换时轻换上浮，miuix 式丝滑） */
  .ver:not([hidden]), .dl-note:not([hidden]), .log-card:not([hidden]) {
    animation: fade-in-up var(--dur-med) var(--ease-standard) backwards;
  }
</style>
</head>
<body>
  <!-- lucide 图标 sprite（ISC 许可，https://lucide.dev/license）：
       notebook-pen / flame / receipt / dot / download / check / flask-conical / calendar
       其中 flame 与 receipt 路径照抄两 App 仓库 ic_launcher_foreground.xml（同为 Lucide 24 视口）；
       sq-bg = squircle 超椭圆底（|x|⁵+|y|⁵=1，108 视口 8% 留白）叠两 App 启动图标同款竖直蓝渐变。
       所有字形置于 68×68 居中方框（x/y=20），favicon.svg 用同一视口与同一方框，四处尺寸一致；
       68 而非更小，是为了 16px 标签页里白字形仍能看清。
       容器用零尺寸定位而非 display:none：渐变等 paint server 不能从 display:none 子树解析 -->
  <svg style="position:absolute; width:0; height:0; overflow:hidden" aria-hidden="true">
    <defs>
      <linearGradient id="app-grad" x1="0" y1="0" x2="0" y2="1">

  <main class="wrap">

    <section class="intro">

        <p class="noscript-note">未启用 JavaScript，无法探测下载通道，下载按钮不可用。启用后请刷新页面。</p>

    <section class="cards">
      <!-- 无 JS 时的静态兜底：至少能看到两个应用名与介绍；JS 加载后由 cardHTML() 整体替换 -->

  <footer>
    <div class="wrap">
      <p>© 2026 · 屑涵</p>

  </footer>

  <script>
  // 下载通道探测：OpenList 的裸 GET 一律返回 SPA 壳，读文件必须走 /api/fs/get 换 raw_url。
  // APK 直链同理——artifacts[].url 裸 GET 会拿到 HTML，页面加载时用 fs/get 换签名 raw_url 作 href。
  // 没有 version.json 的通道视为未发布：不给下载入口，也不让它占着默认选中位（只有测试版时自动落到测试版）。
  // 获取失败与确认未发布分开处理：失败可就地重试，回焦/回前台静默复探，不打断正在展示的版本。
  (function () {
    var STORAGE = 'https://storage.horatio.cn';
    var TIMEOUT = 8000;
    var ORDER = ['stable', 'beta'];

    function fetchWithTimeout(url, opts) {
      var ctrl = new AbortController();
      var timer = setTimeout(function () { ctrl.abort(); }, TIMEOUT);
      opts = opts || {};
      opts.signal = ctrl.signal;
      return fetch(url, opts).finally(function () { clearTimeout(timer); });
    }

    function fetchRaw(path) {
      return fetchWithTimeout(STORAGE + '/api/fs/get', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ path: path })
      })
        .then(function (r) { return r.json(); })
        .then(function (j) {
          if (j && j.code === 200 && j.data && j.data.raw_url) return { raw: j.data.raw_url };
          // fs/get 对不存在的路径明确回 "object not found"，这才算「未发布」；
          // 网络失败/超时/非 200 一律是获取失败，不能冒充未发布
          if (j && /object not found/.test(j.message || '')) return { missing: true };
          return { error: true };
        })
        .catch(function () { return { error: true }; });
    }

    function loadChannel(dir, ch) {
      return fetchRaw('/' + dir + '/' + ch + '/version.json').then(function (res) {
        if (res.error) return { status: 'error' };
        if (res.missing) return { status: 'empty' };
        return fetchWithTimeout(res.raw)
          .then(function (r) { return r.ok ? r.json() : null; })
          .catch(function () { return null; })
          .then(function (meta) {
            // version.json 是 Wails 式 camelCase：versionName / publishedAt / notes / artifacts[]，
            // 没有 snake_case 也没有顶层 download_url/changelog。取 Android 产物（arm64 单包，无则第一条）。
            if (!meta || !meta.versionName || !meta.artifacts || !meta.artifacts.length) return { status: 'error' };
            var art = meta.artifacts.filter(function (a) { return a.platform === 'android-arm64'; })[0] || meta.artifacts[0];
            if (!art || !art.url) return { status: 'error' };
            var apkPath = null;
            try { apkPath = new URL(art.url, STORAGE).pathname; } catch (e) {}
            if (!apkPath) return { status: 'error' };
            return fetchRaw(apkPath).then(function (apkRes) {
              if (!apkRes.raw) return { status: 'error' };
              var notes = meta.notes || '';
              return {
                status: 'ready',
                version: meta.versionName,
                updated: meta.publishedAt || '',
                size: typeof art.size === 'number' ? art.size : 0,
                log: typeof notes === 'string' ? notes : '',
                href: apkRes.raw
              };
            });
          });
      });
    }

    function fmtDate(iso) {
      var d = new Date(iso);
      if (isNaN(d.getTime())) return '';
      var p = function (n) { return (n < 10 ? '0' : '') + n; };
      return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
    }

    var CH = {
      stable: { name: '正式版', label: '下载正式版' },
      beta: { name: '测试版', label: '下载测试版' }
    };

    // 两卡结构相同、仅数据不同：单一数组 + 单一渲染，避免逐行复制造成结构漂移。
    var APPS = [
      {
        cls: 'cal',
        dir: 'CalorieDiary',
        ico: '<use href="#sq-bg"/><use href="#i-flame" x="20" y="20" width="68" height="68"/>',
        name: '热量日记',
        desc: '记录饮食、体重与喝水，查看每日预算与周报'
      },
      {
        cls: 'exp',
        dir: 'ExpenseDiary',
        ico: '<use href="#sq-bg"/><use href="#i-receipt" x="20" y="20" width="68" height="68"/>',
        name: '开支日记',
        desc: '记录每笔收支、分类与预算，查看统计与周报'
      }
    ];

    function cardHTML(app) {
      var p = app.cls;
      return '<article class="card ' + p + '" data-app="' + app.dir + '">' +
        '<div class="card-head">' +
          '<svg class="app-ico" width="64" height="64" viewBox="0 0 108 108" aria-hidden="true">' + app.ico + '</svg>' +
          '<div class="card-head-text">' +
            '<h2>' + app.name + '</h2>' +
            '<p class="card-desc">' + app.desc + '</p>' +
          '</div>' +
        '</div>' +
        '<div class="dl">' +
          '<div class="chans" data-mode="loading">' +
            '<span class="chan-static is-loading">正在获取版本…</span>' +
          '</div>' +
          '<div class="dl-row" hidden><p class="dl-note" hidden></p></div>' +
          '<div class="dl-row">' +
            '<span class="chip ver" hidden></span>' +
            '<span class="with-ico upd" hidden><svg class="ico"><use href="#i-calendar"/></svg><span></span></span>' +
            '<span class="sz" hidden></span>' +
          '</div>' +
          '<a class="btn is-loading" aria-busy="true">' +
            '<svg class="ico"><use href="#i-download"/></svg><span class="btn-label">正在获取版本</span>' +
          '</a>' +
          '<section class="log-card" aria-labelledby="' + p + '-log-title" hidden>' +
            '<h3 class="log-title" id="' + p + '-log-title">本版更新</h3>' +
            '<div class="log-body"></div>' +
          '</section>' +
        '</div>' +
      '</article>';
    }

    document.querySelector('.cards').innerHTML = APPS.map(cardHTML).join('');

    document.querySelectorAll('.card[data-app]').forEach(function (card) {
      var dir = card.getAttribute('data-app');
      var chans = card.querySelector('.chans');
      var note = card.querySelector('.dl-note');
      var noteRow = note.parentElement;
      var verEl = card.querySelector('.ver');
      var updEl = card.querySelector('.upd');
      var updText = card.querySelector('.upd span');
      var szEl = card.querySelector('.sz');
      var logCard = card.querySelector('.log-card');
      var logBody = card.querySelector('.log-body');
      var btn = card.querySelector('.btn');
      var btnLabel = card.querySelector('.btn-label');

      var st = { stable: { status: 'loading' }, beta: { status: 'loading' } };
      var sel = 'stable';
      var picked = false; // 用户手动选过通道后，探测/复探都不再改选
      var mode = '';

      function ready(ch) { return st[ch].status === 'ready'; }

      // 默认落在有包的最高通道（正式版优先）；没有正式版就自动落到测试版，
      // 不会因为正式版缺失或获取失败而卡在一个点不动的选项上
      function syncSelection() {
        if (picked && ready(sel)) return;
        for (var i = 0; i < ORDER.length; i++) {
          if (ready(ORDER[i])) { sel = ORDER[i]; return; }
        }
      }

      // 通道行按可用数量换形态：两个都有包才是分段控件，只剩一个就是静态徽标，
      // 不给「看起来能点、点了没反应」的灰选项
      function buildChans() {
        var n = 0, only = null;
        ORDER.forEach(function (ch) { if (ready(ch)) { n++; only = ch; } });
        var loading = ORDER.some(function (ch) { return st[ch].status === 'loading'; });
        var m = n > 1 ? 'seg' : n === 1 ? 'single' : loading ? 'loading' : 'none';
        var changed = m !== mode;
        mode = m;
        chans.setAttribute('data-mode', m);
        if (m === 'seg') {
          chans.setAttribute('role', 'radiogroup');
          chans.setAttribute('aria-label', '下载通道');
          if (changed) {
            chans.innerHTML = ORDER.map(function (ch) {
              return '<button class="chan" type="button" role="radio" data-chan="' + ch + '"' +
                ' aria-checked="' + (ch === sel) + '" tabindex="' + (ch === sel ? 0 : -1) + '">' +
                CH[ch].name + '</button>';
            }).join('');
          } else {
            ORDER.forEach(function (ch) {
              var b = chans.querySelector('[data-chan="' + ch + '"]');
              b.setAttribute('aria-checked', String(ch === sel));
              b.tabIndex = ch === sel ? 0 : -1;
            });
          }
          return;
        }
        chans.removeAttribute('role');
        chans.removeAttribute('aria-label');
        if (!changed) return;
        if (m === 'loading') {
          chans.innerHTML = '<span class="chan-static is-loading">正在获取版本…</span>';
        } else if (m === 'none') {
          chans.innerHTML = '<span class="chan-static is-none">暂无可用版本</span>';
        } else {
          chans.innerHTML = '<span class="chan-static">' +
            '<svg class="ico" aria-hidden="true"><use href="' + (only === 'stable' ? '#i-check' : '#i-flask') + '"/></svg>' +
            CH[only].name + '</span>';
        }
      }

      // 事件委托：内层按状态重建，监听不丢
      chans.addEventListener('click', function (e) {
        var b = e.target.closest && e.target.closest('.chan');
        if (b) pick(b.getAttribute('data-chan'));
      });
      chans.addEventListener('keydown', function (e) {
        if (mode !== 'seg') return;
        var dir = e.key === 'ArrowRight' || e.key === 'ArrowDown' ? 1
          : e.key === 'ArrowLeft' || e.key === 'ArrowUp' ? -1 : 0;
        if (!dir) return;
        e.preventDefault();
        var next = ORDER[(ORDER.indexOf(sel) + dir + ORDER.length) % ORDER.length];
        pick(next);
        var b = chans.querySelector('[data-chan="' + next + '"]');
        if (b) b.focus();
      });

      var motionOK = !matchMedia('(prefers-reduced-motion: reduce)').matches;
      function pick(ch) {
        if (!ready(ch) || ch === sel) return;
        sel = ch;
        picked = true;
        render();
        if (!motionOK) return;
        // 通道切换：内容轻换（200ms 上浮淡入），reduced-motion 下静默
        [verEl, updEl, logCard, note].forEach(function (el) {
          if (!el || el.hidden || !el.animate) return;
          el.animate([{ opacity: 0, transform: 'translateY(4px)' }, { opacity: 1, transform: 'none' }],
            { duration: 200, easing: 'cubic-bezier(.16, 1, .3, 1)' });
        });
      }

      function renderLog(log) {
        logBody.textContent = '';
        var lines = typeof log === 'string'
          ? log.split('\n').map(function (l) { return l.trim(); }).filter(Boolean).slice(0, 60)
          : [];
        if (!lines.length) {
          logBody.classList.add('is-empty');
          logBody.textContent = '此版本暂无更新说明';
          return;
        }
        logBody.classList.remove('is-empty');
        lines.forEach(function (l) {
          // 无破折号的行是组标题（新增/修复/…），带破折号的是条目
          var item = /^[-·*]/.test(l);
          var row = document.createElement('div');
          row.className = item ? 'log-item' : 'log-head';
          if (item) {
            var ico = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            ico.setAttribute('class', 'ico');
            ico.setAttribute('aria-hidden', 'true');
            var use = document.createElementNS('http://www.w3.org/2000/svg', 'use');
            use.setAttribute('href', '#i-dot');
            ico.appendChild(use);
            row.appendChild(ico);
            row.appendChild(document.createTextNode(l.replace(/^[-·*]\s*/, '')));
          } else {
            row.textContent = l;
          }
          logBody.appendChild(row);
        });
      }

      function render() {
        syncSelection();
        buildChans();
        var s = st[sel];

        note.hidden = true;
        note.textContent = '';
        noteRow.hidden = true;
        verEl.hidden = true;
        updEl.hidden = true;
        szEl.hidden = true;
        logCard.hidden = true;
        btn.classList.remove('is-off');

        if (s.status === 'loading') {
          btn.classList.add('is-loading');
          btn.setAttribute('aria-busy', 'true');
          btn.removeAttribute('href');
          btnLabel.textContent = '正在获取版本';
          return;
        }
        btn.classList.remove('is-loading');
        btn.removeAttribute('aria-busy');

        if (s.status === 'ready') {
          btn.href = s.href;
          btnLabel.textContent = CH[sel].label;
          verEl.textContent = s.version;
          verEl.hidden = false;
          var date = fmtDate(s.updated);
          updText.textContent = date;
          updEl.hidden = !date;
          szEl.textContent = s.size ? (s.size / 1048576).toFixed(1) + ' MB' : '';
          szEl.hidden = !s.size;
          renderLog(s.log);
          logCard.hidden = false;
          // 只有一个通道有包时说明原因，避免「想切换却点不动」的错觉
          var other = sel === 'stable' ? 'beta' : 'stable';
          if (st[other].status === 'empty') {
            note.textContent = CH[other].name + '尚未发布，当前提供' + CH[sel].name;
            note.hidden = false;
            noteRow.hidden = false;
          }
          return;
        }

        // 未发布 / 获取失败：统一空态，禁用按钮、不留下载入口
        btn.classList.add('is-off');
        btn.removeAttribute('href');
        btnLabel.textContent = '暂无版本';
        if (s.status === 'error') {
          // 存储抖动造成的瞬时失败不该粘死：给一个就地重试入口
          note.textContent = '版本信息获取失败，请稍后重试';
          note.appendChild(document.createTextNode(' '));
          var retry = document.createElement('button');
          retry.type = 'button';
          retry.className = 'retry-link';
          retry.textContent = '重试';
          retry.addEventListener('click', function () { probeAll(); });
          note.appendChild(retry);
        } else {
          note.textContent = '暂无可下载版本';
        }
        note.hidden = false;
        noteRow.hidden = false;
      }

      var probing = false;
      var lastProbe = 0;
      function probeAll(opts) {
        if (probing) return;
        opts = opts || {};
        probing = true;
        lastProbe = Date.now();
        if (!opts.silent) {
          ORDER.forEach(function (ch) { st[ch] = { status: 'loading' }; });
          render();
        }
        Promise.all(ORDER.map(function (ch) {
          return loadChannel(dir, ch).then(function (res) {
            // 静默复探失败时保留已展示的下载，不让一次抖动把按钮打回空态
            if (opts.silent && res.status === 'error' && ready(ch)) return;
            st[ch] = res;
            render();
          });
        })).then(function () {
          probing = false;
          render();
        });
      }
      // 回焦/回到前台复探：只补错误与「未发布」的通道，且节流；
      // 复探静默进行，不把正在展示的版本重置成骨架屏
      function reprobeIfStale() {
        if (probing) return;
        var idle = Date.now() - lastProbe;
        var errored = ORDER.some(function (ch) { return st[ch].status === 'error'; });
        var missing = ORDER.some(function (ch) { return st[ch].status === 'empty'; });
        if ((errored && idle > 15000) || (missing && idle > 60000)) probeAll({ silent: true });
      }
      window.addEventListener('focus', reprobeIfStale);
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible') reprobeIfStale();
      });
      probeAll();
    });
  })();
  </script>
</body>
</html>
